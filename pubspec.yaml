name: social_share_pro
description: Share images to Instagram Stories, Facebook Stories, WhatsApp Status and Instagram Direct, with background gradients, Facebook App ID and story links.
version: 1.0.0
repository: https://github.com/DabhiNavaghan/social_share_pro
issue_tracker: https://github.com/DabhiNavaghan/social_share_pro/issues
topics:
  - share
  - instagram
  - facebook
  - whatsapp
  - social

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: dev.navaghandabhi.social_share_pro
        pluginClass: SocialShareProPlugin
      ios:
        pluginClass: SocialShareProPlugin
